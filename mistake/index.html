<style>

x-wrap:wrap;margin-top:30px}.primary,.secondary{border:0;border-radius:16px;padding:16px 26px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:20px;min-height:58px;transition:transform .15s,background .15s}.primary{background:var(--ink);color:white;box-shadow:0 5px 0 #142d27}.primary:hover{background:#3c544c;transform:translateY(-2px)}.primary:active{transform:translateY(2px);box-shadow:none}.primary:disabled{background:#e5e8e0;color:#7a837b;box-shadow:none;transform:none}.secondary{border:1px solid var(--line);background:transparent}.secondary:hover{background:#eceee5}.tiny{font-size:12px;color:var(--muted)}.hero-art{position:relative;min-height:380px;display:flex;align-items:center;justify-content:center}.hero-art>svg{width:100%;overflow:visible}.float-label{position:absolute;border:1px solid #d4dacd;background:var(--white);box-shadow:0 5px 0 #e5e8dd;border-radius:13px;padding:8px 15px;font-size:13px;font-weight:750;transform:rotate(-7deg);top:10%;left:9%}.float-label.bottom{top:auto;bottom:10%;left:auto;right:0;transform:rotate(6deg);background:#f0ebff}.steps{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:28px 0 38px;gap:28px}.step{display:flex;align-items:flex-start;gap:12px}.step-num{width:31px;height:31px;flex:none;border-radius:50%;background:#e9ede2;display:grid;place-items:center;font-size:12px;font-weight:800}.step strong{font-size:15px}.step p{font-size:13px;color:var(--muted);margin-top:3px}.welcome-note{display:flex;gap:12px;align-items:center;justify-content:center;padding:14px 20px;background:#efeee6;border-radius:13px;font-size:13px;margin-bottom:25px}.welcome-note span:first-child{font-size:19px}footer{padding:24px 0;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line)}.view{animation:appear .25s ease-out}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.quiz{max-width:790px;margin:0 auto;padding:42px 0 55px}.quiz-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:750;margin-bottom:12px}.quiz-top b{font-size:22px;color:var(--coral)}.progress{height:7px;border-radius:10px;background:#e6e8dd;overflow:hidden;margin-bottom:32px}.progress-fill{height:100%;background:var(--coral);border-radius:10px;transition:width .2s}.question-kicker{display:flex;align-items:center;gap:10px;margin-bottom:14px}.scene-icon{width:40px;height:40px;border-radius:13px;background:var(--peach);font-size:22px;display:grid;place-items:center}.scene-label{font-size:12px;color:var(--muted);font-weight:700}.question-title{font-size:clamp(25px,3vw,33px);line-height:1.5;letter-spacing:-1px;outline:none}.question-hint{font-size:13px;color:var(--muted);margin:12px 0 23px}fieldset{border:0;padding:0;margin:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.answers{display:grid;gap:11px}.option{position:relative;display:flex;align-items:center;gap:15px;border:1.5px solid #dcded3;border-radius:17px;background:var(--white);padding:17px 20px;cursor:pointer;transition:background .12s,border .12s,transform .12s;min-height:76px;font-size:16px;line-height:1.65}.option:hover{border-color:#8da499;transform:translateX(2px)}.option:has(input:checked){border-color:var(--ink);background:#e9f0e6;box-shadow:0 0 0 1px var(--ink)}.option input{position:absolute;opacity:0;width:1px;height:1px}.option-symbol{display:grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:#f0f0e9;font-size:12px;font-weight:800}.option:has(input:checked) .option-symbol{background:var(--ink);color:white}.option:has(input:checked) .option-symbol::after{content:'✓'}.option:has(input:checked) .option-symbol span{display:none}.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}.back{border:0;background:transparent;padding:14px 4px;font-weight:750;font-size:14px}.back:disabled{opacity:.3}.quiz-privacy{font-size:11px;color:var(--muted);margin-top:20px;text-align:center}.results{max-width:890px;margin:0 auto;padding:48px 0}.results-intro{text-align:center;margin-bottom:30px}.results-intro h1{font-size:36px;margin:13px 0}.results-intro p{font-size:14px;color:var(--muted)}.result-list{display:grid;gap:24px}.result-card{border:1.5px solid #d5ddce;border-radius:25px;overflow:hidden;background:var(--white);box-shadow:var(--shadow)}.result-hero{display:grid;grid-template-columns:180px 1fr;gap:30px;align-items:center;padding:30px 35px;background:var(--tint)}.animal{width:100%;height:150px}.result-hero .tag{font-size:11px;background:#fff9}.result-name{font-size:34px;margin:12px 0}.result-subtitle{font-size:15px;font-weight:750}.result-content{padding:28px 35px}.result-description{font-size:16px;line-height:1.9}.action-title{margin-top:25px;margin-bottom:14px;font-size:17px}.action-list{list-style:none;padding:0;margin:0;display:grid;gap:14px}.action-list li{display:flex;gap:12px;font-size:14px}.action-list b{width:25px;height:25px;background:var(--tint);border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px}.letter{margin-top:25px;background:#f5f3e9;border-radius:16px;padding:21px 24px}.letter .letter-label{font-size:11px;letter-spacing:1.3px;font-weight:800;color:#6a7165;margin-bottom:8px}.letter p{font-size:15px;line-height:1.9}.gentle-note{font-size:13px;text-align:center;line-height:1.9;color:var(--muted);padding:24px 15px}.next-activity{padding:27px 30px;border:1px solid #d9d1e7;background:#f1ecf8;border-radius:22px;margin-top:6px}.next-activity .eyebrow{color:#715583;margin-bottom:9px;letter-spacing:1px}.next-activity p{font-size:14px;line-height:1.9;margin-top:12px}.next-activity h3{font-size:23px}.challenge{margin-top:17px;background:#fff9;border-radius:13px;padding:15px 18px;font-size:14px}.all-types{margin-top:26px}.all-types>summary{cursor:pointer;font-weight:750;padding:16px 0}.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}.mini-type{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:18px;display:grid;grid-template-columns:65px 1fr;gap:14px;align-items:center}.mini-type svg{height:70px}.mini-type h3{font-size:16px;letter-spacing:-.5px}.mini-type p{font-size:12px;margin-top:5px;color:var(--muted)}.result-actions{display:flex;justify-content:center;margin-top:32px}.no-script{padding:25px;background:#ffebe2;border-radius:15px;margin:30px 0}::selection{background:#f8c4b2}

<body>
<div class="shell">
<header><div class="brand"><span class="brand-mark" aria-hidden="true">✳</span> 큰솔아이 <span style="font-weight:500;font-size:13px;color:var(--muted)">마음 탐험실</span></div><span class="header-note">실수해도, 다시!</span></header>
<main id="app"></main>
<noscript><p class="no-script">이 활동을 하려면 브라우저에서 자바스크립트를 켜 주세요. 선생님께 도움을 요청해도 좋아요.</p></noscript>
<footer><span>큰솔아이 사회정서교육 · 스스로 튼튼</span><span>이름 입력 없이, 응답 저장 없이 가볍게 탐험해요.</span></footer>
</div>
<script>
'use strict';
const TYPES=[
{name:'숨숨 달팽이',key:'snail',tint:'#e7eddb',subtitle:'잠깐, 나만의 껍데기 안으로',description:'실수한 순간, 잠깐 숨어 있고 싶은 마음이 먼저 찾아와요. 말하거나 다시 손대기까지 시간이 필요할 수 있어요. 마음을 가라앉힐 시간을 가진 뒤, 작은 행동 하나로 밖으로 나와 봐요.',actions:['숨을 천천히 내쉬고, “지금 좀 당황했구나” 하고 내 마음을 알아줘요.','믿을 만한 사람에게 “나 실수해서 좀 당황했어”라고 한마디 꺼내 봐요.','혼자 어렵다면 도움을 받아요. 누군가 곤란해졌다면 상황을 알리고, 내가 할 수 있는 수습부터 시작해요.'],letter:'당황했지? 잠깐 숨을 골라도 괜찮아. 준비가 되면 작은 말 한마디부터 꺼내 보자. 혼자 하기 어렵다면 같이 해 달라고 부탁해도 돼.',mission:'얼룩을 본 내 마음을 속으로 말해 본 뒤, 종이를 한 번 돌려 봐요.',short:'잠깐 숨을 고르고, 작은 말 한마디부터.'},
{name:'생각빙빙 고양이',key:'cat',tint:'#eee7f8',subtitle:'왜 그랬지? 생각이 빙글빙글',description:'“왜 그랬지?”라는 생각이 오래 맴돌아요. 실수한 행동을 넘어 나 자신에게까지 속상해질 때가 있어요. 그럴 때는 나 전체에 점수를 매기기보다, 바꿀 수 있는 한 부분을 찾아봐요.',actions:['“잘하고 싶어서 속상하구나” 하고 지금의 마음을 인정해 줘요.','“나는 왜 이래”를 “내가 이 부분을 놓쳤구나”로 바꿔 말해 봐요.','지금 고칠 수 있는 부분 하나를 찾아요. 생각만 빙빙 돈다면 다른 사람과 함께 살펴봐요.'],letter:'속상하지? 잘하고 싶었으니까 그럴 수 있어. 하지만 한 번의 실수로 너 전체를 평가하지는 말자. 지금 바꿀 수 있는 한 부분부터 찾아보자.',mission:'“망쳤어”라는 생각이 들면 “여기에 무엇을 더해 볼까?”로 질문을 바꿔 봐요.',short:'나를 탓하는 말 대신, 바꿀 부분 하나 찾기.'},
{name:'함께톡톡 수달',key:'otter',tint:'#e0efe9',subtitle:'같이 생각하면 길이 보일 거야',description:'혼자 끙끙대기보다 누군가에게 이야기하거나 같이 방법을 찾는 반응이 먼저 나와요. 도움을 구하는 것은 다시 시작하는 한 가지 방법이에요. 도움을 받은 뒤 내가 할 수 있는 몫도 찾아봐요.',actions:['“파일이 다른 것 같아. 완성본인지 같이 확인해 줄래?”처럼 필요한 도움을 구체적으로 말해 봐요.','함께 찾은 방법 중 내가 직접 해 볼 부분 하나를 정해요.','도와준 사람에게 고마움을 전해요. 처음 물어본 사람이 어렵다면 다른 사람에게 부탁해도 괜찮아요.'],letter:'혼자 막막할 때 함께할 사람을 찾아도 괜찮아. 어떤 도움이 필요한지 말해 보자. 도움을 받으면서 네가 할 수 있는 한 걸음도 직접 내디뎌 보자.',mission:'아이디어가 막히면 “이 얼룩은 뭐처럼 보여?”라고 묻고, 그중 내가 그리고 싶은 것을 골라요.',short:'필요한 도움을 말하고, 내 몫도 한 걸음.'},
{name:'다시뚝딱 비버',key:'beaver',tint:'#f9e6d6',subtitle:'어디부터 고쳐 볼까? 뚝딱!',description:'실수가 생기면 손을 움직여 고치거나 다른 방법을 시도하는 반응이 먼저 나와요. 행동하기 전에 마음을 잠깐 살피면 더 차분하게 시작할 수 있어요. 다른 사람이 곤란해졌다면 그 마음도 함께 살펴봐요.',actions:['바로 움직이기 전, “나 지금 어떤 기분이지?” 하고 잠깐 멈춰 봐요.','다른 사람이 곤란해졌다면 사과하고, 어떻게 해 주면 좋을지 물어봐요.','고칠 부분 하나부터 시작해요. 같은 방법으로 잘 안 되면 방법을 바꾸거나 도움을 구해요.'],letter:'다시 해 보려는 네 마음을 응원해. 서두르기 전에 네 마음도 한번 살펴보자. 함께한 사람의 마음까지 챙기면서, 한 부분씩 고쳐 가면 돼.',mission:'바로 그리기 전에 얼룩에서 떠오르는 모양을 두 가지 찾아보고, 하나를 골라 시작해요.',short:'마음도 살핀 뒤, 한 부분씩 다시 시작하기.'}
];
const QUESTIONS=[
['🎤','발표 시간','발표하다가 머릿속이 하얘졌다. 준비한 말이 생각나지 않는다!',['“아무도 나를 안 봤으면…” 얼른 내 차례가 끝나길 바란다.','“연습까지 했는데, 나는 왜 이러지?” 나에게 속상해진다.','친구나 선생님을 보며 다음 말을 떠올릴 힌트를 구한다.','기억나는 내용부터 말하며 발표를 이어 가 본다.']],
['🎨','미술 시간','거의 완성한 그림에 검은 잉크가 뚝 떨어졌다.',['얼룩이 보이지 않게 종이를 덮어 두고 싶다.','“조금만 조심할걸…” 잉크를 떨어뜨린 순간이 자꾸 생각난다.','친구에게 “이거 어떻게 하면 좋을까?” 하고 물어본다.','얼룩을 보며 바꿔 그릴 수 있는 모양을 찾아본다.']],
['🎒','등교한 아침','학교에 와 보니 오늘 필요한 준비물 대신 엉뚱한 물건을 가져왔다.',['준비물을 확인하는 시간이 안 왔으면 좋겠다.','“어제 제대로 챙겼어야 했는데…” 나를 탓한다.','빌리거나 함께 쓸 수 있는지 주변에 물어본다.','가방 속 다른 물건으로 대신할 방법을 찾아본다.']],
['💧','빌린 공책','친구에게 빌린 공책에 실수로 물을 조금 쏟았다.',['친구에게 말할 생각을 하니 입이 잘 떨어지지 않는다.','“왜 남의 물건에 이런 실수를…” 나 자신에게 화가 난다.','친구에게 상황을 말하고 어떻게 해 주면 좋을지 묻는다.','먼저 미안하다고 말하고, 젖은 부분을 닦으며 수습한다.']],

['🌙','하루가 끝날 때','집에 왔는데 낮에 했던 실수가 갑자기 떠올랐다.',['그 생각을 피하려고 얼른 다른 걸 본다.','“그때 왜 그랬을까…” 같은 장면을 여러 번 떠올린다.','편하게 이야기할 수 있는 사람에게 그 일을 말한다.','다음에 비슷한 일이 생기면 해 볼 행동을 하나 생각한다.']]

function heroArt(){return '<div class="hero-art" aria-hidden="true"><span class="float-label">실수한 마음도, 괜찮아.</span><svg viewBox="0 0 460 380"><path d="M68 195C34 85 166 25 291 58C442 95 459 229 358 308C266 380 109 331 68 195Z" fill="#e9eddf"/><ellipse cx="234" cy="311" rx="160" ry="16" fill="#dce2ce"/><path d="M63 112L68 100L73 112L86 116L73 121L68 134L63 121L50 116Z" fill="#ecb66f"/><path d="M375 208L380 198L385 208L395 213L385 218L380 229L375 218L365 213Z" fill="#b8a4cf"/><path d="M348 75Q379 88 381 116" stroke="#d7826f" stroke-width="3" fill="none" stroke-dasharray="5 5"/><g transform="translate(39 142) rotate(-8 80 80)">'+animal('snail')+'</g><g transform="translate(139 53) scale(1.16)">'+animal('cat')+'</g><g transform="translate(273 155) scale(.84)">'+animal('otter')+'</g><g transform="translate(192 205) scale(.75)">'+animal('beaver')+'</g></svg><span class="float-label bottom">다시 시작할 힘을 찾아요 ↗</span></div>';}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function scoreAnswers(values){if(values.length!==QUESTIONS.length||values.some(v=>!Number.isInteger(v)||v<0||v>=TYPES.length))throw Error('모든 문항에 응답해 주세요.');const counts=TYPES.map(()=>0);values.forEach(v=>counts[v]++);const max=Math.max(...counts);return {counts,winners:counts.map((n,i)=>n===max?i:-1).filter(i=>i>=0)};}
const app=document.getElementById('app');
let answers=Array(QUESTIONS.length).fill(null),orders=[],current=0,screen='home';
function focusView(id){const target=document.getElementById(id);if(target)target.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'});}
function home(moveFocus=false){screen='home';app.innerHTML='<section class="view"><div class="hero"><div><p class="eyebrow">MY LITTLE MIND ADVENTURE</p><h1 id="home-title" tabindex="-1">앗, 실수했다!<br><em>그다음의 나는?</em></h1><p class="intro">숨고 싶기도, 다시 해 보고 싶기도.<br>실수한 순간의 내 마음을 만나고<br>나에게 맞는 ‘다시’의 힘을 찾아봐요.</p><div class="hero-actions"><button type="button" class="primary" data-action="start">내 마음 탐험하기 <span aria-hidden="true">↗</span></button><span class="tiny">18가지 상황 · 약 4~5분</span></div></div>'+heroArt()+'</div><div class="steps"><div class="step"><span class="step-num">01</span><div><strong>나라면 어떨까?</strong><p>첫 생각과 가장 가까운 답 고르기</p></div></div><div class="step"><span class="step-num">02</span><div><strong>내 마음 발견!</strong><p>자주 나타나는 나의 반응 만나기</p></div></div><div class="step"><span class="step-num">03</span><div><strong>실수해도, 다시</strong><p>나에게 맞는 작은 행동 찾아보기</p></div></div></div><div class="welcome-note"><span aria-hidden="true">✳</span><span>정답은 없어요. 멋있어 보이는 답보다 평소 나와 가까운 답을 골라요.<br>겪어 보지 않은 상황은 상상해도 괜찮아요.</span></div></section>';if(moveFocus)focusView('home-title');}
function start(){answers=Array(QUESTIONS.length).fill(null);orders=QUESTIONS.map(()=>shuffle([0,1,2,3]));current=0;screen='quiz';quiz();}
function quiz(){const q=QUESTIONS[current],selected=answers[current],done=answers.filter(x=>x!==null).length;screen='quiz';app.innerHTML='<section class="quiz view"><div class="quiz-top"><span>내 마음을 만나는 중</span><span><b>'+(current+1)+'</b> / '+QUESTIONS.length+'</span></div><div class="progress" role="progressbar" aria-label="응답 진행" aria-valuemin="0" aria-valuemax="18" aria-valuenow="'+done+'"><div class="progress-fill" style="width:'+(done/QUESTIONS.length*100)+'%"></div></div><div class="question-kicker"><span class="scene-icon" aria-hidden="true">'+q[0]+'</span><span class="scene-label">'+q[1]+'</span></div><h2 class="question-title" id="question-title" tabindex="-1">'+escapeHTML(q[2])+'</h2><p class="question-hint" id="question-hint">이 순간, 가장 먼저 떠오를 생각이나 행동은?</p><fieldset aria-labelledby="question-title" aria-describedby="question-hint"><legend class="sr-only">나와 가장 가까운 반응 하나 고르기</legend><div class="answers">'+orders[current].map((type,i)=>'<label class="option"><input type="radio" name="answer" value="'+type+'"'+(selected===type?' checked':'')+'><span class="option-symbol" aria-hidden="true"><span>'+String.fromCharCode(65+i)+'</span></span><span>'+escapeHTML(q[3][type])+'</span></label>').join('')+'</div></fieldset><div class="quiz-nav"><button type="button" class="back" data-action="back"'+(current===0?' disabled':'')+'>← 이전 질문</button><button type="button" class="primary" data-action="next" id="next"'+(selected===null?' disabled':'')+'>'+(current===QUESTIONS.length-1?'내 마음 결과 보기':'다음 질문')+' <span aria-hidden="true">→</span></button></div><p class="quiz-privacy">답은 자유롭게 바꿔도 돼요. 새로고침하면 처음부터 시작해요.</p></section>';focusView('question-title');}
function resultCard(i){const t=TYPES[i];return '<article class="result-card" style="--tint:'+t.tint+'"><div class="result-hero">'+animal(t.key,'class="animal"')+'<div><span class="tag">이번에 자주 나타난 내 반응</span><h2 class="result-name">'+t.name+'</h2><p class="result-subtitle">'+t.subtitle+'</p></div></div><div class="result-content"><p class="result-description">'+t.description+'</p><h3 class="action-title">나에게 맞는 ‘다시’의 연습</h3><ol class="action-list">'+t.actions.map((a,n)=>'<li><b aria-hidden="true">'+(n+1)+'</b><span>'+a+'</span></li>').join('')+'</ol><div class="letter"><p class="letter-label">TO. 또 실수할 나에게</p><p>'+t.letter+'</p></div></div></article>';}
function result(){const {winners}=scoreAnswers(answers);screen='result';app.innerHTML='<section class="results view"><div class="results-intro"><span class="tag">18가지 마음 탐험 완료 ✦</span><h1 id="result-title" tabindex="-1">내 마음에서 발견한 모습은?</h1><p>'+(winners.length>1?'같은 횟수로 나타난 반응이 '+winners.length+'가지예요. 두루 살펴보며 나와 닮은 모습을 찾아봐요.':'이번 선택에서 자주 나타난 내 반응을 만나 봐요.')+'</p></div><div class="result-list">'+winners.map(resultCard).join('')+'</div><p class="gentle-note">이 결과는 이번 선택에서 자주 나타난 반응이에요.<br>상황에 따라 다른 모습도 나타날 수 있어요. 좋고 나쁜 유형이나 정해진 성격은 없어요.</p><section class="next-activity"><p class="eyebrow">NEXT · 이게 실수라고? 작품인데!</p><h3>이제, 얼룩을 만날 시간!</h3><p>검은 얼룩이 있는 종이를 받으면 내 첫 반응을 알아차려 봐요.<br>그다음에는 아래의 작은 도전을 해 볼까요?</p>'+winners.map(i=>'<div class="challenge"><strong>'+TYPES[i].name+'의 작은 도전</strong><br>'+TYPES[i].mission+'</div>').join('')+'<p>수업 마지막에는 오늘 찾은 방법을 담아<br><strong>‘언젠가 또 실수할 미래의 나’에게 쪽지를 써 봐요.</strong></p></section><details class="all-types"><summary>다른 마음의 모습도 궁금해요</summary><div class="type-grid">'+TYPES.map(t=>'<article class="mini-type">'+animal(t.key)+'<div><h3>'+t.name+'</h3><p>'+t.short+'</p></div></article>').join('')+'</div><p class="tiny" style="margin-top:15px">누구에게나 여러 모습이 있을 수 있어요. 친구에게 결과를 꼭 공개할 필요는 없어요.<br>이 활동은 내 반응을 알아보는 수업용 마음 탐색 활동이며, 전문 심리검사가 아니에요.</p></details><div class="result-actions"><button type="button" class="secondary" data-action="restart">처음으로 돌아가기 <span aria-hidden="true">↺</span></button></div></section>';focusView('result-title');}
app.addEventListener('change',event=>{if(screen!=='quiz'||event.target.name!=='answer')return;const v=Number(event.target.value);if(!orders[current].includes(v))return;answers[current]=v;document.getElementById('next').disabled=false;const done=answers.filter(x=>x!==null).length;const progress=app.querySelector('[role="progressbar"]');progress.setAttribute('aria-valuenow',done);app.querySelector('.progress-fill').style.width=(done/QUESTIONS.length*100)+'%';});
app.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;switch(button.dataset.action){case 'start':start();break;case 'next':if(screen!=='quiz'||answers[current]===null)return;if(current<QUESTIONS.length-1){current++;quiz();}else result();break;case 'back':if(screen==='quiz'&&current>0){current--;quiz();}break;case 'restart':answers.fill(null);orders=[];current=0;home(true);break;}});
home();
</script>
</body>
</html>
